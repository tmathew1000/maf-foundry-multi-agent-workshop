[project]
name = "maf-foundry-customer-support-agent"
version = "0.1.0"
description = "Governed multi-agent customer support workshop built with Microsoft Agent Framework."
requires-python = ">=3.13"
dependencies = [
    "agent-framework-foundry",
    "agent-framework-foundry-hosting>=1.0.0b260813",
    "azure-identity",
    "debugpy",
    "opentelemetry-exporter-otlp-proto-grpc",
    "pydantic",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
